<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Tushar ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;
overflow:hidden;

font-family:'Poppins',sans-serif;

background:linear-gradient(135deg,#ff758c,#ff7eb3,#fad0c4,#ffd1ff);

background-size:400% 400%;

animation:bg 12s infinite;

display:flex;
justify-content:center;
align-items:center;

color:white;

}


@keyframes bg{

0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}

}



.container{

width:90%;
max-width:900px;

padding:40px;

text-align:center;

background:rgba(255,255,255,.18);

border-radius:35px;

backdrop-filter:blur(15px);

box-shadow:0 20px 60px rgba(0,0,0,.25);

z-index:2;

}



h1{

font-family:'Dancing Script',cursive;

font-size:65px;

animation:glow 2s infinite;

}



h2{

font-size:32px;

margin:15px;

}



p{

font-size:18px;

line-height:1.9;

}



button{

margin-top:25px;

padding:15px 35px;

border:none;

border-radius:40px;

font-size:17px;

font-weight:bold;

cursor:pointer;

color:#ff4081;

background:white;

transition:.4s;

}


button:hover{

transform:scale(1.1);

background:#ff4081;

color:white;

}



#musicBtn{

position:absolute;

top:20px;

right:20px;

}


#journey{

margin-top:25px;

font-size:22px;

font-weight:bold;

}


#letter{

display:none;

margin-top:30px;

padding:30px;

background:rgba(255,255,255,.25);

border-radius:25px;

backdrop-filter:blur(15px);

max-height:55vh;

overflow:auto;

}


#typedText{

white-space:pre-line;

}



.heart{

position:absolute;

bottom:-40px;

animation:float linear infinite;

}



@keyframes float{

from{

transform:translateY(0);

opacity:0;

}

20%{

opacity:1;

}

to{

transform:translateY(-120vh);

opacity:0;

}

}



@keyframes glow{

50%{

text-shadow:0 0 30px white;

}

}



</style>

</head>


<body>



<audio id="music" loop>

<!-- Replace this link with your favorite song file -->

<source src="your-song.mp3" type="audio/mpeg">

</audio>



<button id="musicBtn" onclick="playMusic()">

🎵 Music

</button>




<div class="container">


<h1>
🎂 Happy Birthday ❤️
</h1>


<h2>
Tushar Dubey
</h2>



<p>

Every year, this day reminds me how lucky I am that you came into this world.

<br>

You are my happiness, my comfort, and my forever person.

</p>



<div id="journey">

❤️ Our Journey Together ❤️

<br>

<span id="counter"></span>

</div>



<button onclick="openLetter()">

💌 Open My Heart

</button>




<div id="letter">

<h2>
My Dearest Tushar ❤️
</h2>


<p id="typedText"></p>


</div>


</div>





<script>


// Relationship start date
const startDate = new Date("2020-01-01");


function updateCounter(){

let today=new Date();

let diff=today-startDate;


let days=Math.floor(diff/(1000*60*60*24));

let years=Math.floor(days/365);

let months=Math.floor((days%365)/30);

let remainingDays=(days%365)%30;



document.getElementById("counter").innerHTML=

years+" Years "+months+" Months "+remainingDays+" Days of Togetherness ✨";

}


updateCounter();

setInterval(updateCounter,86400000);





let message=`

Happy Birthday, My Love ❤️


Our journey together has been the most beautiful chapter of my life.


Thank you for being my biggest support, my safe place, and the person who makes ordinary moments feel special.


Every smile, every memory, every little moment with you is something I treasure deeply.


I feel grateful for every day we share and excited for all the beautiful moments waiting for us ahead.


On your birthday, I wish you endless happiness, success, and everything your heart desires.


I hope we continue creating countless memories, holding hands through every season of life.


Thank you for loving me.

Thank you for choosing me.

Thank you for being YOU.


I love you more than words can explain ❤️


Forever Yours,

Shakti ❤️
`;



let index=0;


function openLetter(){

document.getElementById("letter").style.display="block";

typeWriter();

}



function typeWriter(){

if(index < message.length){

document.getElementById("typedText").innerHTML += message.charAt(index);

index++;

setTimeout(typeWriter,35);

}

}





function playMusic(){

let music=document.getElementById("music");

music.play();

document.getElementById("musicBtn").innerHTML="🎶 Playing";

}





function createHeart(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(Math.random()*20+15)+"px";

heart.style.animationDuration=(Math.random()*5+5)+"s";


document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},10000);

}



setInterval(createHeart,300);



</script>


</body>
</html>
